name: tests

# Paused: tests run locally (vendor/bin/pint --test, vendor/bin/phpunit) while the
# organisation's free Actions allowance is used up. Run by hand from the Actions tab
# ("Run workflow"); to turn automatic runs back on, restore:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: platform_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: user-interface

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl, gd
          coverage: none

      # Sibling iquesters modules from the same branch (falls back to main),
      # linked as path repositories until their releases are on Packagist.
      - name: Link sibling modules
        if: ${{ 'foundation' != '' }}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.MODULES_TOKEN || github.token }}
        run: |
          for dep in foundation; do
            url="https://x-access-token:${GH_TOKEN}@github.com/iquesters/${dep}.git"
            git clone --depth 1 --branch "$BRANCH" "$url" "$dep" || git clone --depth 1 "$url" "$dep"
            (cd user-interface && composer config "repositories.$dep" \
              "{\"type\":\"path\",\"url\":\"../$dep\",\"options\":{\"symlink\":false,\"versions\":{\"iquesters/$dep\":\"2.99.0\"}}}")
          done

      - name: Install dependencies
        working-directory: user-interface
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        working-directory: user-interface
        run: vendor/bin/phpunit

  assets:
    name: JS bundle up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # public/dist/userinterface.js must match public/js (run `npm run build` and commit).
      - run: npm run build:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer global require laravel/pint --no-interaction
      - run: ~/.composer/vendor/bin/pint --test
